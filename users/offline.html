<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Mất kết nối - MODEL SHOP</title>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0b0b; color: #eee; font-family: Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
        .box { max-width: 380px; }
        .ico { font-size: 56px; margin-bottom: 12px; }
        h1 { font-size: 22px; margin: 0 0 10px; color: #ff4a4a; }
        p { color: #aaa; line-height: 1.6; margin: 0 0 22px; }
        button, a { display: inline-block; min-height: 46px; padding: 0 22px; line-height: 46px; border: none; border-radius: 8px; background: #dc2626; color: #fff; font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <div class="ico"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M12 20h.01" /> <path d="M8.5 16.429a5 5 0 0 1 7 0" /> <path d="M5 12.859a10 10 0 0 1 5.17-2.69" /> <path d="M19 12.859a10 10 0 0 0-2.007-1.523" /> <path d="M2 8.82a15 15 0 0 1 4.177-2.643" /> <path d="M22 8.82a15 15 0 0 0-11.288-3.764" /> <path d="m2 2 20 20" /> </svg> </div>
        <h1>Bạn đang offline</h1>
        <p>Không kết nối được tới MODEL SHOP. Hãy kiểm tra Wi-Fi / 4G rồi thử lại. Các trang bạn đã xem gần đây vẫn mở được.</p>
        <button type="button" onclick="location.reload()">Thử lại</button>
    </div>
</body>
</html>
