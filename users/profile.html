<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tài khoản - MODEL SHOP</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/responsive.css">
    <meta name="theme-color" content="#5a0000">
    <meta name="description" content="Thông tin tài khoản MODEL SHOP.">
    <meta name="robots" content="noindex, follow">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="48x48" href="images/icons/favicon-48.png">
    <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MODEL SHOP">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:site_name" content="MODEL SHOP">
    <meta property="og:locale" content="vi_VN">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tài khoản - MODEL SHOP">
    <meta property="og:description" content="Thông tin tài khoản MODEL SHOP.">
    <meta property="og:image" content="images/banner1.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <script src="js/pwa.js" defer></script>
    <script src="js/a11y.js" defer></script>
</head>

<body class="auth-page">

    <div class="header">
        <a href="index.html" class="header-link">
            <img src="images/logo.png" alt="Logo" class="auth-logo-img">
            <div class="logo-text">MODEL<span>SHOP</span></div>
        </a>
    </div>

    <div class="profile-wrap">
        <div class="profile-box">
            <h2 class="profile-title">Hồ Sơ Của Tôi</h2>

            <div class="info-row">
                <span class="label">Tài khoản</span>
                <span class="value" id="profileUsername">-</span>
            </div>
            <div class="info-row">
                <span class="label">Email</span>
                <span class="value" id="profileEmail">-</span>
            </div>
            <div class="info-row">
                <span class="label">Vai trò</span>
                <span class="value" id="profileRole">-</span>
            </div>
            <div class="info-row" id="profilePointsRow" style="display:none;">
                <span class="label">Điểm thưởng</span>
                <span class="value" id="profilePoints">0</span>
            </div>
            <div class="form-hint" id="profilePointsHint" style="display:none; margin-top:-10px; margin-bottom:14px;"></div>

            <div class="profile-actions">
                <a href="orders.html" class="btn-secondary">Lịch sử đơn hàng</a>
                <a href="#" class="btn-secondary" id="profileLogoutBtn">Đăng xuất</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth-service.js"></script>
    <script src="js/shop-core.js"></script>
    <script src="js/ai-assistant.js"></script>
    <script src="js/chat-widget.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/bottom-nav.js"></script>
</body>

</html>
