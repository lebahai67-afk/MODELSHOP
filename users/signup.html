<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Đăng ký - MODEL SHOP</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/signup.css">
    <link rel="stylesheet" href="css/responsive.css">
    <meta name="theme-color" content="#5a0000">
    <meta name="description" content="Tạo tài khoản MODEL SHOP.">
    <meta name="robots" content="noindex, follow">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="48x48" href="images/icons/favicon-48.png">
    <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MODEL SHOP">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:site_name" content="MODEL SHOP">
    <meta property="og:locale" content="vi_VN">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Đăng ký - MODEL SHOP">
    <meta property="og:description" content="Tạo tài khoản MODEL SHOP.">
    <meta property="og:image" content="images/banner1.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <script src="js/pwa.js" defer></script>
    <script src="js/a11y.js" defer></script>
</head>

<body class="auth-page">
    <div class="header">
        <a href="index.html" class="header-link">
            <img src="images/logo.png" alt="Logo" class="auth-logo-img">
            <div class="logo-text">MODEL<span>SHOP</span></div>
        </a>
    </div>

    <div class="main-container">

        <div class="form-section">
            <div class="form-box">
                <h2 class="form-title">ĐĂNG KÝ TÀI KHOẢN</h2>

                <form id="signupForm">
                    <input type="text" id="name" placeholder="Tài khoản (6-18 ký tự) *" required>
                    <input type="email" id="email" placeholder="Email *" required>
                    <input type="password" id="password" placeholder="Mật khẩu (6-18 ký tự) *" required>

                    <div class="checkbox-group">
                        <input type="checkbox" id="showPass1">
                        <label for="showPass1">Hiện mật khẩu</label>
                    </div>

                    <input type="password" id="confirmPassword" placeholder="Xác nhận mật khẩu *" required>

                    <div class="checkbox-group">
                        <input type="checkbox" id="showPass2">
                        <label for="showPass2">Hiện mật khẩu</label>
                    </div>

                    <button type="submit" class="btn-primary">ĐĂNG KÝ</button>
                </form>

                <div id="message" class="message"></div>

                <div class="divider">Hoặc đăng ký với</div>

                <div class="social-login">
                    <button type="button" class="social-btn facebook-btn">
                        <img src="images/facebook-icon.png" alt="Facebook" class="social-icon">
                        Facebook
                    </button>
                    <button type="button" class="social-btn gg-btn">
                        <img src="images/google-icon.png" alt="GG" class="social-icon">
                        Google
                    </button>
                </div>

                <div class="switch-link">
                    Đã có tài khoản? <a href="signin.html">Đăng nhập ngay</a>
                </div>
            </div>
        </div>

        <div class="branding-section">
            <img src="images/logo.png" alt="Logo" class="auth-logo-img branding-logo">
            <h1 class="brand-title">MODEL<span>SHOP</span></h1>
            <p class="brand-slogan">Cửa hàng mô hình uy tín hàng đầu Việt Nam</p>
            <div class="features">
                <div>Sản phẩm chính hãng 100%</div>
                <div>Giao hàng toàn quốc</div>
                <div>Bảo hành đổi trả miễn phí</div>
                <div>Tư vấn nhiệt tình</div>
                <div>Giá cả cạnh tranh</div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth-service.js"></script>
    <script src="js/signup.js"></script>
</body>

</html>
